<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<style>:root{color-scheme:dark}body{margin:0}</style>
﻿<title>フレーム劇場</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Noto+Sans+JP:wght@700;900&family=Noto+Serif+JP:wght@700;900&display=swap">
<style>
/* Layout: a single phone-width column on black, like a camera app. Header, 3:4 shot, a scrolling row of frame cards, text fields and options for the chosen frame, and a bottom dock with the shutter-style save button. */
:root {
  --bg: #000000;
  --surface: #161616;
  --surface-2: #232323;
  --fg: #ffffff;
  --muted: #8e8e8e;
  --line: #2a2a2a;
  --accent: #ffffff;
  --accent-fg: #000000;
  --focus: #8fb0ff;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  --font-mono: "DM Mono", ui-monospace, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { background: var(--bg); }
body {
  color: var(--fg); font-family: var(--font-body);
  padding-block: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.app { max-width: 440px; margin: 0 auto; display: grid; gap: 14px; padding-top: 8px; padding-bottom: 128px; }

header { display: grid; grid-template-columns: 88px 1fr 88px; align-items: center; height: 52px; }
.hdr-r { display: flex; justify-content: flex-end; }
header h1 { margin: 0; text-align: center; font-size: 1.15rem; font-weight: 900; letter-spacing: 0.04em; }
.icon {
  width: 44px; height: 44px; border-radius: 50%; border: 0; background: transparent; color: var(--fg);
  display: grid; place-items: center; cursor: pointer;
}
.icon:hover { background: var(--surface); }
.icon svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.off { visibility: hidden; pointer-events: none; }

.shot { position: relative; }
canvas#cv { display: block; width: 100%; height: auto; aspect-ratio: 3 / 4; border-radius: 20px; background: #0d0d0d; touch-action: manipulation; }
.hint {
  position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); pointer-events: none;
  background: rgba(0, 0, 0, 0.6); color: #fff; font-size: 0.72rem; padding: 6px 12px; border-radius: 999px; white-space: nowrap;
}

.picker { display: flex; gap: 10px; overflow-x: auto; padding: 2px 2px 6px; scroll-snap-type: x proximity; scrollbar-width: none; }
.picker::-webkit-scrollbar { display: none; }
.fcard {
  flex: none; width: 82px; display: grid; gap: 6px; justify-items: center; background: transparent; border: 0; padding: 0;
  color: var(--muted); font-family: inherit; font-size: 0.72rem; font-weight: 500; cursor: pointer; scroll-snap-align: start;
}
.fcard canvas { width: 82px; height: 109px; border-radius: 12px; background: var(--surface); display: block; outline: 2px solid transparent; outline-offset: 2px; }
.fcard[aria-pressed="true"] { color: var(--fg); }
.fcard[aria-pressed="true"] canvas { outline-color: var(--fg); }
.fcard span { text-align: center; line-height: 1.3; }

.sheet { background: var(--surface); border-radius: 18px; padding: 16px; display: grid; gap: 14px; align-content: start; }
.sheet[hidden] { display: none; }
.field { display: grid; grid-template-columns: 5.5em minmax(0, 1fr); align-items: center; gap: 10px; font-size: 0.86rem; }
.field[hidden] { display: none; }
.seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.seg.five { grid-template-columns: repeat(5, 1fr); }
.seg button {
  font-family: inherit; font-size: 0.82rem; padding: 10px 2px; border-radius: 10px; border: 0;
  background: var(--surface-2); color: var(--fg); cursor: pointer;
}
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); font-weight: 700; }
.row { display: grid; grid-template-columns: 5.5em minmax(0, 1fr) 3em; align-items: center; gap: 10px; font-size: 0.86rem; }
.row output { font-family: var(--font-mono); font-size: 0.78rem; color: var(--muted); text-align: right; }
.opt { display: grid; gap: 14px; }
.opt[hidden] { display: none; }
input[type="range"] { width: 100%; accent-color: #fff; }
input[type="text"] {
  width: 100%; font-family: var(--font-body); font-size: 0.9rem; padding: 11px 12px; border: 0; border-radius: 10px;
  background: var(--surface-2); color: var(--fg);
}
.check { display: flex; align-items: center; gap: 10px; font-size: 0.9rem; }
.check input { accent-color: #fff; width: 18px; height: 18px; flex: none; }
.small { color: var(--muted); font-size: 0.78rem; line-height: 1.6; margin: 0; }

.dock {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  background: linear-gradient(to top, #000 70%, rgba(0, 0, 0, 0));
  padding-top: 24px;
  padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.dock-in { max-width: 440px; margin: 0 auto; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; }
.pick {
  justify-self: center; display: grid; justify-items: center; gap: 4px; background: transparent; border: 0; color: var(--fg);
  font-family: inherit; font-size: 0.72rem; cursor: pointer; min-width: 0;
}
.pick .thumb {
  width: 48px; height: 48px; border-radius: 12px; background: var(--surface-2) center / cover no-repeat;
  display: grid; place-items: center; border: 1px solid var(--line);
}
.pick .thumb svg { width: 20px; height: 20px; stroke: var(--muted); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.shutter {
  width: 76px; height: 76px; border-radius: 50%; border: 4px solid #fff; background: transparent; padding: 0; cursor: pointer;
  display: grid; place-items: center;
}
.shutter i { display: block; width: 58px; height: 58px; border-radius: 50%; background: #fff; transition: transform 0.12s; }
.shutter:active i { transform: scale(0.88); }
input[type="file"] { display: none; }
#msg { text-align: center; font-size: 0.78rem; color: var(--muted); min-height: 1.2em; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { .shutter i { transition: none; } }
#fieldsSheet.collapsed .field, #fieldsSheet.collapsed .check { display: none; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font-family: inherit; font-size: 0.8rem; padding: 9px 12px; border-radius: 999px; border: 1.5px solid #3a3a3c; background: var(--surface-2); color: var(--fg); cursor: pointer; }
.chip.empty { border-style: dashed; color: var(--muted); }
.chip.on { border-color: #ffd000; color: #ffd000; }
.seg-btn { font-family: inherit; font-size: 0.82rem; padding: 10px 12px; border-radius: 10px; border: 0; background: var(--surface-2); color: var(--fg); cursor: pointer; }
.edit-hl {
  position: absolute; z-index: 7; pointer-events: none; border: 3px solid #ffd000; border-radius: 8px;
  box-shadow: 0 0 0 2px rgba(0,0,0,.55); animation: hlp 0.9s ease-in-out infinite alternate;
}
@keyframes hlp { from { opacity: 1; } to { opacity: .35; } }
.edit-panel {
  position: fixed; left: 0; right: 0; z-index: 30; background: #1c1c1e; border-top: 1px solid #3a3a3c;
  padding: 10px max(16px, env(safe-area-inset-left, 0px)) calc(10px + env(safe-area-inset-bottom, 0px));
  box-shadow: 0 -8px 28px rgba(0,0,0,.65);
}
.ep-in { max-width: 440px; margin: 0 auto; display: grid; gap: 8px; }
.ep-top { display: flex; justify-content: space-between; align-items: center; }
.ep-label { font-size: 0.82rem; font-weight: 700; color: #ffd000; }
.ep-done { font-family: inherit; font-size: 0.9rem; font-weight: 700; padding: 9px 22px; border: 0; border-radius: 999px; background: #fff; color: #000; cursor: pointer; }
input.ep-input { height: 50px; font-size: 16px; font-weight: 700; border-radius: 12px; background: #fff; color: #111; padding: 0 14px; }
@media (prefers-reduced-motion: reduce) { .edit-hl { animation: none; } }
#miniCv {
  position: fixed; top: 10px; right: max(10px, env(safe-area-inset-right, 10px));
  width: 72px; height: 96px; border-radius: 10px; z-index: 20;
  display: none; box-shadow: 0 2px 16px rgba(0,0,0,0.75);
  border: 1.5px solid rgba(255,255,255,0.18); background: #0d0d0d; cursor: pointer;
}
#miniCv.show { display: block; }
</style>


</head>
<body>
<canvas id="miniCv" width="216" height="288" aria-hidden="true"></canvas>
<div class="app">
  <header>
    <button class="icon" type="button" id="reset" aria-label="サンプルに戻す">
      <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
    </button>
    <h1>フレーム劇場</h1>
    <div class="hdr-r">
      <button class="icon off" type="button" id="swap" aria-label="2枚を入れ替える">
        <svg viewBox="0 0 24 24"><path d="M7 4 3 8l4 4"/><path d="M3 8h14"/><path d="m17 20 4-4-4-4"/><path d="M21 16H7"/></svg>
      </button>
      <button class="icon" type="button" id="copy" aria-label="画像をコピー">
        <svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>
      </button>
    </div>
  </header>

  <div class="shot">
    <canvas id="cv" width="1080" height="1440" role="img" aria-label="選んだ枠を重ねた写真のプレビュー"></canvas>
    <div class="hint" id="hint" hidden>小さい写真をタップで入れ替え</div>
  </div>

  <div class="picker" id="picker" role="group" aria-label="枠を選ぶ"></div>

  <div class="sheet collapsed" id="fieldsSheet">
    <p class="small">画像の文字を直接タップすると、その場で書き換えられます。空の項目などはここから入力できます。</p>
    <div id="fieldChips" class="chips" role="group" aria-label="編集する項目"></div>
    <button type="button" id="toggleFields" class="seg-btn">文字欄をすべて表示</button>
    <label class="field" id="r-name"><span id="l-name">名前</span><input type="text" id="f-name"></label>
    <label class="field" id="r-tag"><span id="l-tag">ラベル</span><input type="text" id="f-tag"></label>
    <label class="field" id="r-headline"><span id="l-headline">見出し</span><input type="text" id="f-headline"></label>
    <label class="field" id="r-sub"><span id="l-sub">小見出し</span><input type="text" id="f-sub"></label>
    <label class="field" id="r-place"><span id="l-place">右の囲み</span><input type="text" id="f-place"></label>
    <label class="field" id="r-when"><span id="l-when">右の囲み(下)</span><input type="text" id="f-when"></label>
    <label class="field" id="r-tag2"><span id="l-tag2">字幕のラベル</span><input type="text" id="f-tag2"></label>
    <label class="field" id="r-ticker"><span id="l-ticker">流れる文字</span><input type="text" id="f-ticker"></label>
    <label class="field" id="r-time"><span id="l-time">時刻</span><input type="text" id="f-time"></label>
    <label class="field" id="r-suf"><span id="l-suf">名前の後ろ</span><input type="text" id="f-suf"></label>
    <label class="field" id="r-scroll"><span id="l-scroll">スクロールニュース</span><input type="text" id="f-scroll" autocomplete="off"></label>
    <label class="field" id="r-red"><span id="l-red">赤文字</span><input type="text" id="f-red" autocomplete="off"></label>
    <label class="field" id="r-blue"><span id="l-blue">青文字</span><input type="text" id="f-blue" autocomplete="off"></label>
    <label class="check" id="r-scroll-on" hidden><input type="checkbox" id="scroll-on">スクロールティッカーを表示</label>
  </div>

  <div class="sheet" id="viewSheet">
    <label class="check"><input type="checkbox" id="v-contain" checked>写真の全体を枠内に収める(余白はぼかして埋めます)</label>
    <label class="row" for="v-y">上下の位置<input type="range" id="v-y" min="0" max="100" value="40"><output id="v-yO"></output></label>
    <label class="row" for="v-x">左右の位置<input type="range" id="v-x" min="0" max="100" value="50"><output id="v-xO"></output></label>
    <p class="small">初期状態では写真全体を枠内に収めます。枠いっぱいに広げたいときは、チェックを外して上下左右の位置を動かしてください。</p>
  </div>

  <div class="sheet" id="cutSheet">
    <label class="check"><input type="checkbox" id="c-on">人物だけ切り抜いて、ポスター風にする</label>
    <label class="field"><span>大きな文字</span><input type="text" id="c-title" value="WANTED" maxlength="24" autocomplete="off"></label>
    <div class="seg five" id="cSeg" role="group" aria-label="背景の色">
      <button type="button" data-col="#2b6cff" aria-pressed="true">青</button>
      <button type="button" data-col="#ff3d9a" aria-pressed="false">ピンク</button>
      <button type="button" data-col="#12b886" aria-pressed="false">緑</button>
      <button type="button" data-col="#ffc233" aria-pressed="false">黄</button>
      <button type="button" data-col="#151515" aria-pressed="false">黒</button>
    </div>
    <p class="small" id="c-msg">写真を選んでから、チェックを入れてください。切り抜きのAIは端末内で動き、写真は送信されません。</p>
  </div>

  <div class="sheet" id="optSheet">
    <div class="opt" id="opt-led" hidden>
      <div class="seg five" id="ledSeg" role="group" aria-label="ライトの色">
        <button type="button" data-led="full" aria-pressed="true">カラー</button>
        <button type="button" data-led="amber" aria-pressed="false">琥珀</button>
        <button type="button" data-led="red" aria-pressed="false">赤</button>
        <button type="button" data-led="green" aria-pressed="false">緑</button>
        <button type="button" data-led="white" aria-pressed="false">白</button>
      </div>
      <p class="small">写真を小さな光の粒に置き換えます。文字は下の表示欄に出ます。</p>
    </div>
    <div class="opt" id="opt-dual" hidden>
      <div class="seg" id="posSeg" role="group" aria-label="インセットの位置">
        <button type="button" data-pos="tl" aria-pressed="true">左上</button>
        <button type="button" data-pos="tr" aria-pressed="false">右上</button>
        <button type="button" data-pos="bl" aria-pressed="false">左下</button>
        <button type="button" data-pos="br" aria-pressed="false">右下</button>
      </div>
      <label class="row" for="o-size">大きさ<input type="range" id="o-size" min="22" max="50" value="34"><output id="o-sizeO"></output></label>
      <label class="row" for="o-border">枠の太さ<input type="range" id="o-border" min="0" max="24" value="8"><output id="o-borderO"></output></label>
      <label class="row" for="o-radius">角の丸み<input type="range" id="o-radius" min="0" max="60" value="28"><output id="o-radiusO"></output></label>
      <label class="check"><input type="checkbox" id="o-late">遅れて投稿(「2時間遅れ」を表示)</label>
      <label class="check"><input type="checkbox" id="o-flat" checked>加工なしに見える質感にする</label>
    </div>
    <input type="text" id="pasteBox" placeholder="メイン写真を貼り付け(Ctrl+V / 長押しでペースト)" aria-label="メイン写真を貼り付け" autocomplete="off">
    <input type="text" id="subPasteBox" placeholder="自撮り写真を貼り付け(長押しでペースト)" aria-label="自撮り写真を貼り付け" autocomplete="off" style="display:none">
    <p class="small" id="sampleNote">いまはサンプル画像です。下のボタンで選ぶか、コピーした写真を貼り付けると置き換わります。写真は端末内だけで処理されます。</p>
  </div>

  <div id="msg" role="status"></div>
</div>

<div class="dock">
  <div class="dock-in">
    <button class="pick" type="button" id="dropMain" aria-label="写真を選ぶ">
      <span class="thumb" id="thumbMain"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="m21 16-5-5-9 9"/></svg></span>
      <span id="mainLabel">写真</span>
    </button>
    <button class="shutter" type="button" id="save" aria-label="画像を保存"><i></i></button>
    <button class="pick off" type="button" id="dropSub" aria-label="インセット写真を選ぶ">
      <span class="thumb" id="thumbSub"><svg viewBox="0 0 24 24"><circle cx="12" cy="9" r="4"/><path d="M4 21c1-4.5 4-6 8-6s7 1.5 8 6"/></svg></span>
      自撮り
    </button>
  </div>
</div>
<input type="file" id="fileMain" accept="image/*">
<input type="file" id="fileSub" accept="image/*">

<script>
(function () {
  var W = 1080, H = 1440;
  var SANS = '"Noto Sans JP","Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif';
  var SERIF = '"Noto Serif JP","Zen Old Mincho","Hiragino Mincho ProN","Yu Mincho",serif';
  var MONO = '"DM Mono",ui-monospace,Consolas,monospace';
  var cv = document.getElementById("cv");
  var ctx = cv.getContext("2d");
  var $ = function (id) { return document.getElementById(id); };
  var pad2 = function (n) { return ("0" + n).slice(-2); };
  var now = new Date();
  var nowTime = pad2(now.getHours()) + ":" + pad2(now.getMinutes());

  /* ---------- helpers ---------- */
  function rng(seed) {
    return function () {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  /* How the user's own photos are placed in a frame: crop position, or fit whole with a blurred fill. */
  var view = { fx: 0.5, fy: 0.4, contain: true };
  function cover(c, img, x, y, w, h) {
    var iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height;
    var user = img === state.main || img === state.sub || img === poster.canvas;
    var s = Math.max(w / iw, h / ih), dw = iw * s, dh = ih * s;
    if (user && view.contain) {
      var pf = c.filter;
      c.save(); c.beginPath(); c.rect(x, y, w, h); c.clip();
      c.filter = "blur(" + Math.round(Math.max(w, h) / 30) + "px) brightness(.7)";
      c.drawImage(img, x + (w - dw) / 2, y + (h - dh) / 2, dw, dh);
      c.filter = pf;
      var s2 = Math.min(w / iw, h / ih), w2 = iw * s2, h2 = ih * s2;
      c.drawImage(img, x + (w - w2) / 2, y + (h - h2) / 2, w2, h2);
      c.restore();
      return;
    }
    var fx = user ? view.fx : 0.5, fy = user ? view.fy : 0.5;
    c.drawImage(img, x - (dw - w) * fx, y - (dh - h) * fy, dw, dh);
  }
  function rr(c, x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }
  function fit(c, text, weight, family, size, maxW, minSize) {
    while (size > minSize) {
      c.font = weight + " " + size + "px " + family;
      if (c.measureText(text).width <= maxW) return size;
      size -= 2;
    }
    c.font = weight + " " + minSize + "px " + family;
    return minSize;
  }
  function wrap(c, text, maxW) {
    var lines = [], cur = "";
    Array.from(text).forEach(function (ch) {
      if (ch === "\n") { lines.push(cur); cur = ""; return; }
      var t = cur + ch;
      if (c.measureText(t).width > maxW && cur) { lines.push(cur); cur = ch; } else cur = t;
    });
    lines.push(cur);
    return lines;
  }
  function desaturate(c) {
    c.globalCompositeOperation = "saturation";
    c.fillStyle = "#808080"; c.fillRect(0, 0, W, H);
    c.globalCompositeOperation = "source-over";
  }

  /* Example scenes drawn on a canvas so the page opens in a working state. */
  function sample(kind) {
    var c = document.createElement("canvas");
    c.width = 900; c.height = 1200;
    var g = c.getContext("2d");
    var grad = g.createLinearGradient(0, 0, 0, 1200);
    if (kind === "main") { grad.addColorStop(0, "#9db7c9"); grad.addColorStop(0.55, "#d8c7a8"); grad.addColorStop(1, "#5c5547"); }
    else { grad.addColorStop(0, "#c9a79d"); grad.addColorStop(1, "#6a4a47"); }
    g.fillStyle = grad; g.fillRect(0, 0, 900, 1200);
    if (kind === "main") {
      g.fillStyle = "rgba(40,40,40,.55)";
      g.fillRect(90, 520, 220, 680); g.fillRect(340, 380, 260, 820); g.fillRect(630, 600, 200, 600);
      g.fillStyle = "rgba(255,240,200,.7)";
      for (var y = 430; y < 1150; y += 90) { g.fillRect(370, y, 40, 40); g.fillRect(450, y, 40, 40); g.fillRect(530, y, 40, 40); }
      g.fillStyle = "rgba(255,190,60,.9)";

    if (!r) { hl.style.display = "none"; return; }
    var rect = cv.getBoundingClientRect(), shot = cv.parentNode.getBoundingClientRect(), sx = rect.width / cv.width;
    hl.style.display = "block";
    hl.style.left = (rect.left - shot.left + r.x * sx - 8) + "px"; hl.style.top = (rect.top - shot.top + r.y * sx - 6) + "px";
    hl.style.width = (r.w * sx + 16) + "px"; hl.style.height = (r.h * sx + 12) + "px";
  }
  function placePanel() {
    if (!editor) return;
    var h = vv ? vv.height : window.innerHeight, top = vv ? vv.offsetTop : 0;
    editor.style.top = (top + h - editor.offsetHeight) + "px";
    var r = findRegion(editKey);
    if (r) {
      var rect = cv.getBoundingClientRect(), sx = rect.width / cv.width;
      var bottom = rect.top + (r.y + r.h) * sx + 16, limit = top + h - editor.offsetHeight - 8;
      var topEdge = rect.top + r.y * sx - 16;
      if (bottom > limit) window.scrollBy({ top: bottom - limit, behavior: "smooth" });
      else if (topEdge < 60) window.scrollBy({ top: topEdge - 60, behavior: "smooth" });
    }
    updateHl();
  }
  function buildChips() {
    var box = $("fieldChips"), fl = F[state.cur].fields, t = texts[state.cur];
    box.innerHTML = "";
    FIELD_KEYS.forEach(function (k) {
      if (!(k in fl) || k === "scroll") return;
      var b = document.createElement("button");
      b.type = "button"; b.className = "chip" + (t[k] ? "" : " empty") + (k === editKey ? " on" : "");
      b.textContent = (t[k] ? "" : "＋ ") + fl[k];
      b.addEventListener("click", function () { openEditor(k); });
      box.appendChild(b);
    });
  }
  function closeEditor() {
    if (editor) { editor.remove(); editor = null; }
    if (hl) { hl.remove(); hl = null; }
    editKey = null;
    buildChips();
    if (vv) { vv.removeEventListener("resize", placePanel); vv.removeEventListener("scroll", placePanel); }
  }
  function openEditor(k) {
    closeEditor();
    editKey = k;
    var label = F[state.cur].fields[k];
    hl = document.createElement("div"); hl.className = "edit-hl"; cv.parentNode.appendChild(hl);
    editor = document.createElement("div"); editor.className = "edit-panel";
    editor.innerHTML = '<div class="ep-in"><div class="ep-top"><span class="ep-label"></span><button type="button" class="ep-done">完了</button></div><input type="text" class="ep-input" autocomplete="off"></div>';
    editor.querySelector(".ep-label").textContent = "編集中：" + label;
    var inp = editor.querySelector(".ep-input");
    inp.value = texts[state.cur][k] || ""; inp.placeholder = label; inp.setAttribute("aria-label", label);
    inp.addEventListener("input", function () {
      texts[state.cur][k] = inp.value; $("f-" + k).value = inp.value; redraw(); updateHl(); buildChips();
    });
    inp.addEventListener("keydown", function (ev) { if (ev.key === "Enter" || ev.key === "Escape") closeEditor(); });
    editor.querySelector(".ep-done").addEventListener("click", closeEditor);
    document.body.appendChild(editor);
    if (vv) { vv.addEventListener("resize", placePanel); vv.addEventListener("scroll", placePanel); }
    inp.focus(); inp.select();
    buildChips();
    placePanel(); setTimeout(placePanel, 250); setTimeout(placePanel, 600);
  }
  cv.addEventListener("click", function (e) {
    if (hitInset(e)) { swap(); return; }
    var rect = cv.getBoundingClientRect(), px = (e.clientX - rect.left) / rect.width * cv.width, py = (e.clientY - rect.top) / rect.height * cv.height, pad = 14, n, r, k;
    for (n = regions.length - 1; n >= 0; n--) {
      r = regions[n];
      if (px >= r.x - pad && px <= r.x + r.w + pad && py >= r.y - pad && py <= r.y + r.h + pad) {
        k = keyForText(r.text);
        if (k) { openEditor(k); return; }
      }
    }
    closeEditor();
  });
  $("toggleFields").onclick = function () {
    var c = $("fieldsSheet").classList.toggle("collapsed");
    $("toggleFields").textContent = c ? "文字欄をすべて表示" : "文字欄を閉じる";
  };
  cv.addEventListener("mousemove", function (e) { cv.style.cursor = hitInset(e) ? "pointer" : "default"; });

  $("reset").onclick = function () {
    state.main = sample("main"); state.sub = sample("sub");
    setThumb("main", ""); setThumb("sub", "");
    have.main = false; have.sub = false;
    cutReset();
    $("sampleNote").hidden = false; redraw();
  };

  /* person cut-out: the MediaPipe model comes from a CDN, so it is only offered outside the Claude viewer */
  var MP_BASE = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";
  var MP_MODEL = "https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_segmenter/float16/latest/selfie_segmenter.tflite";
  var poster = { on: false, title: "WANTED", color: "#2b6cff", canvas: null };
  var cut = null, segPromise = null, cutBusy = false;
  if (window.claude && window.claude.use) $("cutSheet").hidden = true;

  function cutMsg(text) { $("c-msg").textContent = text; }
  function getSegmenter() {
    if (!segPromise) {
      segPromise = import(MP_BASE + "/vision_bundle.mjs").then(function (m) {
        return m.FilesetResolver.forVisionTasks(MP_BASE + "/wasm").then(function (fileset) {
          return m.ImageSegmenter.createFromOptions(fileset, {
            baseOptions: { modelAssetPath: MP_MODEL },
            runningMode: "IMAGE", outputCategoryMask: true, outputConfidenceMasks: false
          });
        });
      });
      segPromise.catch(function () { segPromise = null; });
    }
    return segPromise;
  }
  function cutFailed(text) {
    cutBusy = false; poster.on = false; $("c-on").checked = false;
    cutMsg(text); redraw();
  }
  function runCut() {
    if (cutBusy) return;
    if (!have.main) { cutFailed("先に、ご自身の写真を選ぶか貼り付けてください。"); return; }
    var src = state.main;
    cutBusy = true;
    cutMsg("人物を切り抜いています…(初回はAIの読み込みで少し時間がかかります)");
    getSegmenter().then(function (seg) {
      var sw = src.naturalWidth || src.width, sh = src.naturalHeight || src.height;
      var k = Math.min(1, 1024 / Math.max(sw, sh));
      var base = document.createElement("canvas");
      base.width = Math.round(sw * k); base.height = Math.round(sh * k);
      base.getContext("2d").drawImage(src, 0, 0, base.width, base.height);
      var res = seg.segment(base);
      var mask = res.categoryMask, arr = mask.getAsUint8Array(), mw = mask.width, mh = mask.height;
      // this model labels the person 0 and everything else non-zero
      var pv = 0, i;
      var cc = document.createElement("canvas"); cc.width = mw; cc.height = mh;
      var cx = cc.getContext("2d");
      cx.drawImage(src, 0, 0, mw, mh);
      var id = cx.getImageData(0, 0, mw, mh), d = id.data;
      for (i = 0; i < arr.length; i++) d[i * 4 + 3] = (arr[i] ? 1 : 0) === pv ? 255 : 0;
      cx.putImageData(id, 0, 0);
      var sm = document.createElement("canvas"); sm.width = mw; sm.height = mh;
      var sx = sm.getContext("2d"); sx.filter = "blur(1.2px)"; sx.drawImage(cc, 0, 0);
      try { mask.close(); } catch (e) {}
      cut = { src: src, canvas: sm };
      cutBusy = false;
      if (state.main !== src) { if (poster.on) runCut(); return; }
      buildPoster(); redraw();
      cutMsg("切り抜きました。大きな文字や背景の色を変えられます。");
    }).catch(function () {
      cutFailed("切り抜きに失敗しました。ネット接続を確認して、もう一度お試しください。");
    });
  }
  function buildPoster() {
    if (!cut) return;
    var PW = 960, PH = 1280;
    var pc = document.createElement("canvas"); pc.width = PW; pc.height = PH;
    var p = pc.getContext("2d");
    p.fillStyle = poster.color; p.fillRect(0, 0, PW, PH);
    var shade = p.createLinearGradient(0, 0, 0, PH);
    shade.addColorStop(0, "rgba(255,255,255,.12)"); shade.addColorStop(1, "rgba(0,0,0,.5)");
    p.fillStyle = shade; p.fillRect(0, 0, PW, PH);
    var title = poster.title.trim();
    if (title) {
      p.save(); p.textAlign = "center"; p.textBaseline = "middle";
      fit(p, title, "900", SANS, 400, PW - 60, 60);
      p.fillStyle = "rgba(255,255,255,.93)"; p.fillText(title, PW / 2, PH * 0.3);
      p.restore();
    }
    var cw = cut.canvas.width, ch = cut.canvas.height;
    var s = view.contain ? Math.min(PW / cw, PH / ch) : Math.max(PW / cw, PH / ch);
    var dw = cw * s, dh = ch * s;
    var dx = (PW - dw) * (view.contain ? 0.5 : view.fx), dy = view.contain ? PH - dh : (PH - dh) * view.fy;
    p.save(); p.shadowColor = "rgba(0,0,0,.4)"; p.shadowBlur = 40;
    p.drawImage(cut.canvas, dx, dy, dw, dh); p.restore();
    poster.canvas = pc;
  }
  function cutChanged() { cut = null; if (poster.on) runCut(); }
  function cutReset() { poster.on = false; $("c-on").checked = false; cut = null; poster.canvas = null; cutMsg("写真を選んでから、チェックを入れてください。切り抜きのAIは端末内で動き、写真は送信されません。"); }
  function cutRefresh() { if (poster.on && cut && cut.src === state.main) buildPoster(); }

  $("c-on").addEventListener("input", function (e) {
    poster.on = e.target.checked;
    if (!poster.on) { cutMsg(""); redraw(); return; }
    if (cut && cut.src === state.main) { buildPoster(); redraw(); } else runCut();
  });
  $("c-title").addEventListener("input", function (e) { poster.title = e.target.value; cutRefresh(); redraw(); });
  Array.prototype.forEach.call(document.querySelectorAll("#cSeg button"), function (b) {
    b.onclick = function () {
      poster.color = b.getAttribute("data-col");
      Array.prototype.forEach.call(document.querySelectorAll("#cSeg button"), function (o) { o.setAttribute("aria-pressed", o === b ? "true" : "false"); });
      cutRefresh(); redraw();
    };
  });
  ["v-contain", "v-y", "v-x"].forEach(function (id) {
    $(id).addEventListener("input", function () { updView(); cutRefresh(); });
  });

  /* photo placement */
  function updView() {
    view.fy = +$("v-y").value / 100; view.fx = +$("v-x").value / 100; view.contain = $("v-contain").checked;
    $("v-yO").textContent = $("v-y").value; $("v-xO").textContent = $("v-x").value;
    $("v-y").disabled = view.contain; $("v-x").disabled = view.contain;
  }
  ["v-contain", "v-y", "v-x"].forEach(function (id) {
    $(id).addEventListener("input", function () { updView(); redraw(); });
  });
  updView();

  /* paste: an image on the clipboard becomes the main photo (in the dual frame, the second one goes to the selfie slot) */
  document.addEventListener("paste", function (e) {
    var items = (e.clipboardData && e.clipboardData.items) || [];
    for (var n = 0; n < items.length; n++) {
      if (items[n].kind === "file" && items[n].type.indexOf("image/") === 0) {
        var f = items[n].getAsFile();
        if (!f) continue;
        e.preventDefault();
        var focusedSub = document.activeElement && document.activeElement.id === "subPasteBox";
        var which = focusedSub ? "sub" : (state.cur === "dual" && have.main && !have.sub ? "sub" : "main");
        load(f, which);
        $("pasteBox").value = ""; $("subPasteBox").value = "";
        $("msg").textContent = which === "sub" ? "自撮りに貼り付けました。" : "写真を貼り付けました。";
        return;
      }
    }
  });

  /* copy the finished image to the clipboard */
  $("copy").onclick = function () {
    $("msg").textContent = "";
    if (!(navigator.clipboard && window.ClipboardItem)) {
      $("msg").textContent = "この画面ではコピーできません。中央の保存ボタンで画像を保存してください。";
      return;
    }
    cv.toBlob(function (blob) {
      if (!blob) { $("msg").textContent = "画像の書き出しに失敗しました。"; return; }
      navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]).then(
        function () { $("msg").textContent = "画像をコピーしました。そのまま貼り付けられます。"; },
        function () { $("msg").textContent = "コピーが許可されませんでした。中央の保存ボタンで画像を保存してください。"; }
      );
    }, "image/png");
  };

  /* save */
  var downloads = null;
  if (window.claude && window.claude.use) {
    window.claude.use("downloads").then(function (x) { downloads = x; }).catch(function () {});
  }
  $("save").onclick = function () {
    $("msg").textContent = "";
    var name = "frame-" + state.cur + ".png";
    cv.toBlob(function (blob) {
      if (!blob) { $("msg").textContent = "画像の書き出しに失敗しました。"; return; }
      if (!downloads) {
        var a = document.createElement("a");
        a.href = URL.createObjectURL(blob); a.download = name;
        document.body.appendChild(a); a.click(); a.remove();
        $("msg").textContent = "保存しました。保存されない場合は、写真を長押しまたは右クリックしてください。";
        return;
      }
      downloads.save({ filename: name, data: blob }).then(
        function () { $("msg").textContent = "保存しました。"; },
        function (e) { $("msg").textContent = e && e.code === "declined" ? "保存をキャンセルしました。" : "保存できませんでした。写真を長押しまたは右クリックで保存してください。"; }
      );
    }, "image/png");
  };

  choose("news");
  startTicker();
  drawThumbs();
  if (document.fonts && document.fonts.load) {
    Promise.all([
      document.fonts.load('900 40px "Zen Kaku Gothic New"'), document.fonts.load('700 40px "Zen Kaku Gothic New"'),
      document.fonts.load('900 40px "Noto Serif JP"'), document.fonts.load('700 40px "Noto Serif JP"'), document.fonts.load('900 40px "Noto Sans JP"'), document.fonts.load('700 40px "Noto Sans JP"'),
      document.fonts.load('500 40px "DM Mono"')
    ]).then(function () { render(); drawThumbs(); }).catch(function () {});
  }
})();
</script>
